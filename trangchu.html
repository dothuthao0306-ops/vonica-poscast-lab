<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WearAI - Test Click</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">
    <div class="max-w-md mx-auto bg-white rounded-2xl p-6 shadow-lg space-y-4 text-center">
        <h1 class="text-2xl font-bold text-indigo-600">Kiểm tra Nút bấm WearAI</h1>
        <p class="text-xs text-gray-500">Nếu bạn bấm vào nút bên dưới mà thấy thông báo hiện lên, nghĩa là code JavaScript đang chạy hoàn hảo!</p>
        
        <button onclick="testClick()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow transition cursor-pointer">
            👉 Bấm vào đây để thử nghiệm
        </button>

        <div id="result" class="text-sm font-semibold text-green-600"></div>
    </div>

    <script>
        function testClick() {
            document.getElementById('result').innerText = "✅ Tuyệt vời! Nút bấm và JavaScript hoạt động bình thường!";
            alert("Đã bấm thành công! Hệ thống phản hồi tốt.");
        }
    </script>
</body>
</html>
